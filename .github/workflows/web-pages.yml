name: Build and deploy Little Orbit web
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Download verified official Godot 4.7.1 and single-thread templates
        run: python3 web/fetch_tools.py --linux-engine
      - name: Export Compatibility web build
        env:
          GODOT_BIN: ${{ github.workspace }}/web/.tools/godot
        run: bash web/build.sh
      - name: Check touch input invariants
        run: web/.tools/godot --headless --path . --script tests/mobile_controls_checks.gd -- --touch-test
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: little-orbit-web
          path: exports/web
      - name: Configure Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v4
        with:
          path: exports/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
